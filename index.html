<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">

<link rel="manifest" href="manifest.json">
<title>EKTECH APPLE STORE</title>
<style>
:root{--navy:#07172b;--navy2:#0e2948;--gold:#c7a65a;--green:#138a63;--orange:#d48725;--red:#c94040;--bg:#f3f5f7;--card:#fff;--line:#e1e6ec;--muted:#687587;--text:#172235;--shadow:0 8px 24px rgba(8,25,48,.07)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;height:auto;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:auto}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}#app{min-height:100%;}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.top{height:64px;background:var(--navy);color:#fff;display:flex;align-items:center;padding:0 14px;gap:10px;position:relative;z-index:20}.hamb{width:42px;height:42px;border:0;border-radius:12px;background:#123050;color:#fff;font-size:21px}.brand{flex:1;font-weight:850;letter-spacing:.2px}.brand small{display:block;font-size:9px;letter-spacing:1.6px;opacity:.6;margin-top:2px}.top .lock{border:0;background:transparent;color:#fff;font-size:20px}.wrap{max-width:1080px;margin:auto;padding:14px}.hero{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:22px;padding:22px 20px;box-shadow:0 14px 30px rgba(7,23,43,.18);margin-bottom:14px}.hero .cap{font-size:12px;opacity:.7;letter-spacing:.2px}.hero .amount{font-size:38px;font-weight:900;margin:7px 0;letter-spacing:-.7px}.hero .sub{font-size:12px;opacity:.7}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:15px;box-shadow:var(--shadow);min-height:78px}.label{font-size:11px;color:var(--muted);line-height:1.35}.val{font-size:22px;font-weight:850;margin-top:6px;letter-spacing:-.2px}.green{color:var(--green)}.orange{color:var(--orange)}.red{color:var(--red)}.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin:16px 0}.quick button{border:1px solid var(--line);background:#fff;border-radius:18px;padding:16px;text-align:left;box-shadow:var(--shadow);min-height:78px}.quick strong{display:block;color:var(--navy);font-size:16px}.quick span{display:block;color:var(--muted);font-size:11px;margin-top:5px}.quick button:first-child,.quick button:nth-child(2){border-top:3px solid var(--navy)}.section{margin:13px 0}.section h3{font-size:15px;margin:0 0 8px}.list{display:grid;gap:8px}.item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px;box-shadow:var(--shadow)}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.tiny{font-size:10px;color:var(--muted)}.pill{display:inline-flex;padding:4px 7px;border-radius:999px;background:#eef2f6;font-size:9px;font-weight:750}.drawer{position:fixed;left:0;top:0;bottom:0;width:min(330px,86vw);background:#fff;z-index:60;padding:18px 14px;transform:translateX(-105%);transition:.18s;box-shadow:15px 0 40px rgba(0,0,0,.22);overflow:auto}.drawer.open{transform:none}.drawer .dbrand{font-weight:850;color:var(--navy);font-size:18px;margin:5px 7px 16px}.drawer button{width:100%;border:0;background:#f5f7f9;color:var(--text);padding:12px;border-radius:11px;text-align:left;margin:3px 0;font-weight:680}.drawer .sep{height:1px;background:var(--line);margin:10px 0}.drawer .danger{color:var(--red)}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:55}.modal{position:fixed;inset:0;background:rgba(4,16,31,.72);z-index:70;display:grid;place-items:center;padding:12px}.sheet{width:min(650px,100%);max-height:93vh;overflow:auto;background:#fff;border-radius:19px;padding:17px}.sheet h2{margin:0 0 13px;font-size:20px}.form{display:grid;gap:9px}.form label{font-size:10px;color:var(--muted);font-weight:750}.form input,.form select{width:100%;padding:11px;border:1px solid #d3dbe4;border-radius:10px;background:#fff;color:var(--text)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn{border:0;border-radius:10px;padding:11px 13px;font-weight:760}.primary{background:var(--navy);color:#fff}.secondary{background:#edf1f5;color:var(--navy)}.dangerBtn{background:#fff0f0;color:#a52e2e}.summary{background:#f6f8fa;border-radius:12px;padding:10px}.summary div{display:flex;justify-content:space-between;gap:12px;padding:4px 0;font-size:12px}.close{border:0;background:#edf1f5;border-radius:9px;padding:6px 9px}.tableWrap{overflow:auto}.table{width:100%;border-collapse:collapse;background:#fff}.table th,.table td{padding:9px;border-bottom:1px solid var(--line);font-size:11px;text-align:left;white-space:nowrap}.empty{text-align:center;color:var(--muted);padding:25px}.login{min-height:100vh;background:linear-gradient(135deg,#061326,#123152);display:grid;place-items:center;padding:18px}.loginbox{width:min(390px,100%);background:#fff;border-radius:22px;padding:24px;box-shadow:0 25px 60px rgba(0,0,0,.35)}.loginbox h1{margin:0;color:var(--navy);font-size:25px}.loginbox .eyebrow{color:var(--gold);font-weight:850;letter-spacing:1.8px;font-size:10px;margin-bottom:8px}.loginbox p{color:var(--muted);font-size:12px}.loginbox input{width:100%;padding:14px;border:1px solid #d3dbe4;border-radius:12px;margin:8px 0 10px}.note{font-size:10px;color:var(--muted);margin-top:9px}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 14px;border-radius:999px;z-index:100;font-size:11px;box-shadow:0 8px 30px #0003}.kpi3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.search{padding:10px;border:1px solid var(--line);border-radius:10px;width:100%;margin-bottom:8px}.dangerText{color:var(--red);font-weight:800}.stockDetail{margin-top:7px;padding-top:7px;border-top:1px solid var(--line);font-size:10px;color:var(--muted)}
@media(max-width:760px){.wrap{padding:12px}.hero{padding:21px 17px}.hero .amount{font-size:36px}.cards{grid-template-columns:repeat(2,1fr)}.quick{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:repeat(2,1fr)}.quick{grid-template-columns:repeat(2,1fr)}.kpi3{grid-template-columns:1fr 1fr}.drawer{width:84vw}.sheet{padding:15px}.hero .amount{font-size:27px}}
</style>
</head>
<body>
<div id="app"></div><div id="drawer"></div><div id="modal"></div><div id="toast"></div>
<script>
const APP='EKTECH APPLE STORE', KEY='ektech_apple_store_v1';
const today=()=>new Date().toISOString().slice(0,10); const uid=()=>crypto.randomUUID?.()||Date.now()+Math.random();
const money=n=>new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:2}).format(n||0);
const days=d=>Math.max(0,Math.floor((Date.now()-new Date(d).getTime())/86400000));
let db=load(); let currentUser=null; let locked=true; let lastActivity=Date.now();
function seed(){return {startCapital:0,cash:0,phones:[],purchases:[],sales:[],receivables:[],capitalMoves:[],audit:[],ibans:[],users:[{id:'admin',name:'Yönetici',role:'Yönetici',pin:'1234',permissions:{delete:true,capital:true,settings:true}}],settings:{lockMinutes:15}}}
function load(){try{return JSON.parse(localStorage.getItem(KEY))||seed()}catch(e){return seed()}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function toast(s){const e=document.getElementById('toast');e.textContent=s;e.className='toast';clearTimeout(window._t);window._t=setTimeout(()=>e.className='',2300)}
function audit(action,meta=''){db.audit.unshift({id:uid(),at:new Date().toISOString(),user:currentUser?.name||'Sistem',action,meta});if(db.audit.length>500)db.audit.pop()}
function totals(){const stock=db.phones.filter(p=>p.status==='STOK');const stockCost=stock.reduce((a,p)=>a+p.cost,0);const revenue=db.sales.filter(s=>s.status!=='İptal').reduce((a,s)=>a+s.price,0);const realized=db.sales.filter(s=>s.status!=='İptal').reduce((a,s)=>a+s.realizedProfit,0);const pending=db.receivables.filter(r=>r.remaining>0).reduce((a,r)=>a+r.pendingProfit,0);const debt=db.receivables.reduce((a,r)=>a+r.remaining,0);const sold=db.sales.filter(s=>s.status!=='İptal').length;return {stock,stockCost,revenue,realized,pending,debt,sold}}
function render(){if(locked){login();return}dashboard()}
function login(){document.getElementById('app').innerHTML=`<div class=login><div class=loginbox><div class=eyebrow>${APP}</div><h1>Güvenli Giriş</h1><p>Telefon ticaret kayıtlarınıza erişmek için PIN'inizi girin.</p><input id=pin type=password inputmode=numeric placeholder='Şifre / PIN' onkeydown="if(event.key==='Enter')loginGo()"><button class="btn primary" style="width:100%" onclick=loginGo()>Giriş Yap</button><div class=note>İlk kurulum PIN'i: 1234. Ayarlar bölümünden değiştirilebilir.</div></div></div>`}
function loginGo(){const p=document.getElementById('pin').value;const u=db.users.find(x=>x.pin===p);if(!u)return toast('PIN hatalı');currentUser=u;locked=false;lastActivity=Date.now();audit('Giriş yapıldı');save();render()}
function dashboard(){const t=totals();const m=today().slice(0,7);const bought=db.purchases.filter(x=>x.date.startsWith(m)).length;const soldMonth=db.sales.filter(x=>x.date.startsWith(m)&&x.status!=='İptal').length;const soldToday=db.sales.filter(x=>x.date===today()&&x.status!=='İptal');const old=t.stock.filter(p=>days(p.stockDate)>=30);document.getElementById('app').innerHTML=`<div class=top><button class=hamb onclick=openDrawer()>☰</button><div class=brand>${APP}<small>TELEFON TİCARET YÖNETİMİ</small></div><button class=lock onclick=lockNow()>⌁</button></div><main class=wrap><section class=hero><div class=cap>KULLANILABİLİR NAKİT SERMAYE</div><div class=amount>${money(db.cash)}</div><div class=sub>Başlangıç sermayesi: ${money(db.startCapital)}</div></section><section class=cards>${card('Başlangıç sermayesi',money(db.startCapital))}${card('Stoka bağlı para',money(t.stockCost))}${card('Toplam satış cirosu',money(t.revenue))}${card('Gerçekleşen net kâr',money(t.realized),'green')}${card('Bekleyen kâr',money(t.pending),'orange')}${card('Bekleyen müşteri alacağı',money(t.debt),'orange')}${card('Stoktaki telefon',t.stock.length)}${card('Bu ay alınan telefon',bought)}${card('Bu ay satılan telefon',soldMonth)}${card('Bugünkü satışlar',soldToday.length)}${card('Uzun süredir stokta',old.length,'orange')}</section><section class=section><h3>Hızlı İşlemler</h3><div class=quick><button onclick=buyModal()><strong>＋ Telefon Al</strong><span>Stoka yeni cihaz ekle</span></button><button onclick=saleModal()><strong>↑ Telefon Sat</strong><span>Stoktan satış ve tahsilat</span></button><button onclick=page('Kâr ve Raporlar')><strong>₺ Kâr</strong><span>Gerçekleşen ve bekleyen kâr</span></button><button onclick=page('Alacaklar')><strong>₺ Alacaklar</strong><span>Müşteri tahsilatları</span></button></div></section>${soldToday.length?`<section class=section><h3>Bugünkü satışlar</h3><div class=list>${soldToday.slice(0,5).map(s=>saleItem(s)).join('')}</div></section>`:''}${old.length?`<section class=section><h3>Uzun süredir stokta</h3><div class=list>${old.slice(0,5).map(stockItem).join('')}</div></section>`:''}</main>`}
function card(l,v,c=''){return `<div class=card><div class=label>${l}</div><div class="val ${c}">${v}</div></div>`}
function stockItem(p){return `<div class=item><div class=row><b>${p.brand} ${p.model}</b><span class=pill>${days(p.stockDate)} gün</span></div><div class=tiny>${p.storage} · ${p.color} · ${money(p.cost)}</div></div>`}
function saleItem(s){const p=db.phones.find(x=>x.id===s.phoneId);return `<div class=item><div class=row><b>${p?.brand||''} ${p?.model||''}</b><span class="pill ${s.profit<0?'red':''}">${money(s.price)}</span></div><div class=tiny>${s.customer} · Tahsilat ${money(s.paid)}</div></div>`}
function openDrawer(){document.getElementById('drawer').innerHTML=`<div class=overlay onclick=closeDrawer()></div><aside class="drawer open"><div class=dbrand>${APP}</div>${['Telefon Stokları','Alışlar','Satışlar','Alacaklar','Sermaye Ekstresi','Kâr ve Raporlar','Aylık Kasa Kapanışı','IBAN ve Belgeler','Kullanıcılar','İşlem Geçmişi','Ayarlar'].map(x=>`<button onclick="page('${x}')">${x}</button>`).join('')}<div class=sep></div><button class=danger onclick=lockNow()>Güvenli Çıkış</button></aside>`}
function closeDrawer(){document.getElementById('drawer').innerHTML=''}
function lockNow(){locked=true;currentUser=null;closeDrawer();render()}
function modal(html){document.getElementById('modal').innerHTML=`<div class=modal onclick="if(event.target===this)closeModal()"><div class=sheet>${html}</div></div>`}
function closeModal(){document.getElementById('modal').innerHTML=''}
function buyModal(){const brands=['Apple','Samsung','Xiaomi','Oppo','Vivo','Honor','Huawei','Google Pixel','Diğer'];const conditions=['Sıfır','İkinci El','Toplama Cihaz'];const origins=['Türkiye Cihazı','Yurt Dışı Cihazı'];const warranty=['No Active Garantili Seri','Aktif Garantili Seri','Aktif Garantisi Bitmiş','Garantisiz','Toplama Cihaz'];const cosmetic=['Sıfır / Kusursuz','10/10','10/9','10/8','10/7','10/6','10/5','10/4','10/3','10/2','10/1'];const use=['0 ay',...Array.from({length:14},(_,i)=>(i+1)+' ay'),'Kullanım süresi bitmiş','Hat kapanmış'];modal(`<div class=row><h2>Telefon Al</h2><button class=close onclick=closeModal()>×</button></div><div class=form><div class=grid2><div><label>Marka</label><select id=bBrand>${brands.map(x=>`<option>${x}</option>`).join('')}</select></div><div><label>Model</label><input id=bModel placeholder="Örn. iPhone 17 Pro Max"></div></div><div class=grid2><div><label>Hafıza</label><input id=bStorage placeholder="256 GB"></div><div><label>Renk</label><input id=bColor placeholder="Resmî renk adı / Diğer"></div></div><div class=grid2><div><label>Seri No</label><input id=bSerial></div><div><label>Alış tarihi</label><input id=bDate type=date value=${today()}></div></div><div class=grid2><div><label>Telefon alış fiyatı</label><input id=bPrice type=number min=0 oninput=buyPreview()></div><div><label>Alış kargo ücreti</label><input id=bShip type=number min=0 value=0 oninput=buyPreview()></div></div><div class=grid2><div><label>Tedarikçi / toptancı</label><input id=bSupplier></div><div><label>Cihaz durumu</label><select id=bCondition>${conditions.map(x=>`<option>${x}</option>`).join('')}</select></div></div><div class=grid2><div><label>Cihaz menşei</label><select id=bOrigin>${origins.map(x=>`<option>${x}</option>`).join('')}</select></div><div><label>Seri / garanti durumu</label><select id=bWarranty>${warranty.map(x=>`<option>${x}</option>`).join('')}</select></div></div><div class=grid2><div><label>Kozmetik durumu</label><select id=bCosmetic>${cosmetic.map(x=>`<option>${x}</option>`).join('')}</select></div><div><label>Kullanım / hat kapanma süresi</label><select id=bUse>${use.map(x=>`<option>${x}</option>`).join('')}</select></div></div><div class=summary id=buySum><div>Alış fiyatı <b>₺0,00</b></div><div>Kargo <b>₺0,00</b></div><div>Toplam gerçek maliyet <b>₺0,00</b></div><div>Sermayeden düşecek <b>₺0,00</b></div><div>Alış sonrası sermaye <b>${money(db.cash)}</b></div></div><button class="btn primary" onclick=saveBuy()>Alışı Kaydet</button></div>`)}
function buyPreview(){const a=+bPrice.value||0,b=+bShip.value||0,c=a+b;buySum.innerHTML=`<div>Alış fiyatı <b>${money(a)}</b></div><div>Kargo <b>${money(b)}</b></div><div>Toplam gerçek maliyet <b>${money(c)}</b></div><div>Sermayeden düşecek <b>${money(c)}</b></div><div>Alış sonrası sermaye <b>${money(db.cash-c)}</b></div>`}
function saveBuy(){const serial=bSerial.value.trim();const price=+bPrice.value||0,ship=+bShip.value||0;if(!bModel.value.trim()||!serial||price<0)return toast('Marka, model, seri no ve alış fiyatı gerekli');if(db.phones.some(p=>p.serial.toLowerCase()===serial.toLowerCase()))return toast('Bu seri numarası zaten kayıtlı');const total=price+ship;if(total>db.cash)return toast('Kullanılabilir sermaye yetersiz');const p={id:uid(),brand:bBrand.value,model:bModel.value.trim(),storage:bStorage.value.trim(),color:bColor.value.trim()||'Diğer',serial,condition:bCondition.value,origin:bOrigin.value,warranty:bWarranty.value,cosmetic:bCosmetic.value,usePeriod:bUse.value,cost:total,buyPrice:price,shipping:ship,stockDate:bDate.value||today(),supplier:bSupplier.value.trim(),status:'STOK'};db.phones.push(p);db.purchases.push({id:uid(),phoneId:p.id,date:p.stockDate,buyPrice:price,shipping:ship,total});db.cash-=total;db.capitalMoves.unshift({id:uid(),date:p.stockDate,type:'Telefon alışı',amount:-total,ref:p.id});audit('Telefon alışı',`${p.brand} ${p.model} · ${money(total)}`);save();closeModal();render();toast('Telefon stoğa eklendi')}
function saleModal(){const stock=db.phones.filter(p=>p.status==='STOK');if(!stock.length)return toast('Satılabilir stok yok');modal(`<div class=row><h2>Telefon Sat</h2><button class=close onclick=closeModal()>×</button></div><div class=form><label>Stoktaki telefon</label><select id=sPhone onchange=salePreview()>${stock.map(p=>`<option value="${p.id}">${p.brand} ${p.model} · ${p.storage} · ${p.color} · ${p.serial}</option>`).join('')}</select><div class=grid2><div><label>Satış fiyatı</label><input id=sPrice type=number min=0 oninput=salePreview></div><div><label>Satış tarihi</label><input id=sDate type=date value=${today()}></div></div><div class=grid2><div><label>Satış türü</label><select id=sType><option>Müşteriye Satış</option><option>Toptancıya Satış</option></select></div><div><label>Ödeme yöntemi</label><select id=sPay><option>Nakit</option><option>Havale/EFT</option><option>Kredi Kartı</option><option>Diğer</option></select></div></div><div class=grid2><div><label>Müşteri / Toptancı</label><input id=sCustomer></div><div><label>Telefon numarası</label><input id=sPhoneNo inputmode=tel></div></div><div class=grid2><div><label>Ödeme durumu</label><select id=sStatus onchange=salePreview()><option>Ödeme tamamlandı</option><option>Kısmi ödeme alındı</option><option>Ödeme daha sonra alınacak</option></select></div><div><label>Ödenen tutar</label><input id=sPaid type=number min=0 value=0 oninput=salePreview></div></div><div class=form><label>Son ödeme tarihi</label><input id=sDue type=date></div><div id=saleSum class=summary></div><button class="btn primary" onclick=saveSale()>Satışı Kaydet</button></div>`);salePreview()}
function salePreview(){const p=db.phones.find(x=>x.id===sPhone.value);const price=+sPrice.value||0;let paid=+sPaid.value||0;if(sStatus.value==='Ödeme tamamlandı')paid=price;if(sStatus.value==='Ödeme daha sonra alınacak')paid=0;sPaid.value=paid;const profit=price-p.cost;const remaining=Math.max(0,price-paid);saleSum.innerHTML=`<div>Toplam gerçek alış maliyeti <b>${money(p.cost)}</b></div><div>Satış fiyatı <b>${money(price)}</b></div><div class="${profit<0?'red':'green'}">Tahmini net kâr <b>${money(profit)}</b></div><div>Kâr oranı <b>${price?((profit/price)*100).toFixed(1):'0.0'}%</b></div><div>Ödenen <b>${money(paid)}</b></div><div>Kalan alacak <b>${money(remaining)}</b></div>${profit<0?'<div class=dangerText>⚠ Zararına satış</div>':''}`}
function saveSale(){const p=db.phones.find(x=>x.id===sPhone.value),price=+sPrice.value||0;let paid=+sPaid.value||0;if(!price)return toast('Satış fiyatı gerekli');if(sStatus.value==='Ödeme tamamlandı')paid=price;if(sStatus.value==='Ödeme daha sonra alınacak')paid=0;if(paid>price)return toast('Tahsilat satış fiyatını aşamaz');const profit=price-p.cost;const s={id:uid(),phoneId:p.id,price,cost:p.cost,profit,paid,realizedProfit:profit*(price?paid/price:0),date:sDate.value||today(),type:sType.value,customer:sCustomer.value.trim()||'Belirtilmedi',phoneNo:sPhoneNo.value.trim(),payment:sPay.value,status:'Tamamlandı'};p.status='SATILDI';p.soldDate=s.date;db.sales.push(s);const remaining=price-paid;if(remaining>0)db.receivables.push({id:uid(),saleId:s.id,customer:s.customer,phoneNo:s.phoneNo,phone:`${p.brand} ${p.model}`,price,paid,remaining,pendingProfit:profit*(remaining/price),due:sDue.value||'',history:paid?[{date:s.date,amount:paid}]:[]});db.cash+=paid;db.capitalMoves.unshift({id:uid(),date:s.date,type:'Satış tahsilatı',amount:paid,ref:s.id});audit('Telefon satışı',`${p.brand} ${p.model} · ${money(price)} · Tahsilat ${money(paid)}`);save();closeModal();render();toast('Satış kaydedildi')}
function page(name){closeDrawer();if(name==='Telefon Stokları')stockPage();else if(name==='Alışlar')purchasesPage();else if(name==='Satışlar')salesPage();else if(name==='Alacaklar')receivablesPage();else if(name==='Sermaye Ekstresi')capitalPage();else if(name==='Kâr ve Raporlar')reportsPage();else if(name==='Aylık Kasa Kapanışı')closingPage();else if(name==='IBAN ve Belgeler')ibanPage();else if(name==='Kullanıcılar')usersPage();else if(name==='İşlem Geçmişi')auditPage();else if(name==='Ayarlar')settingsPage()}
function basePage(title,body){modal(`<div class=row><h2>${title}</h2><button class=close onclick=closeModal()>×</button></div>${body}`)}
function stockPage(){let q='';const arr=db.phones;const rows=arr.map(p=>`<tr><td><b>${p.brand} ${p.model}</b><br>${p.storage} · ${p.color}</td><td>${p.serial}</td><td>${p.condition}<br>${p.origin}</td><td>${money(p.cost)}</td><td>${p.status}${p.status==='STOK'?`<br><span class=tiny>${days(p.stockDate)} gün</span>`:''}</td></tr>`).join('');basePage('Telefon Stokları',`<input class=search placeholder="Model, seri no veya marka ara" oninput="this.nextElementSibling.innerHTML=${'`'}${rows}${'`'}"><div class=tableWrap><table class=table><tr><th>Cihaz</th><th>Seri No</th><th>Durum</th><th>Gerçek maliyet</th><th>Statü</th></tr>${rows||'<tr><td colspan=5 class=empty>Henüz kayıt yok.</td></tr>'}</table></div>`)}
function purchasesPage(){basePage('Telefon Alışları',`<div class=tableWrap><table class=table><tr><th>Tarih</th><th>Cihaz</th><th>Alış</th><th>Kargo</th><th>Toplam</th></tr>${db.purchases.map(x=>{const p=db.phones.find(q=>q.id===x.phoneId);return `<tr><td>${x.date}</td><td>${p?.brand||''} ${p?.model||''}</td><td>${money(x.buyPrice)}</td><td>${money(x.shipping)}</td><td>${money(x.total)}</td></tr>`}).join('')||'<tr><td colspan=5 class=empty>Alış yok.</td></tr>'}</table></div>`)}
function salesPage(){basePage('Telefon Satışları',`<div class=tableWrap><table class=table><tr><th>Tarih</th><th>Cihaz</th><th>Müşteri</th><th>Satış</th><th>Tahsilat</th><th>Kâr</th></tr>${db.sales.map(s=>{const p=db.phones.find(x=>x.id===s.phoneId);return `<tr><td>${s.date}</td><td>${p?.brand||''} ${p?.model||''}</td><td>${s.customer}</td><td>${money(s.price)}</td><td>${money(s.paid)}</td><td class="${s.profit<0?'red':'green'}">${money(s.profit)}</td></tr>`}).join('')||'<tr><td colspan=6 class=empty>Satış yok.</td></tr>'}</table></div>`)}
function receivablesPage(){basePage('Müşteri Alacakları',`<div class=tableWrap><table class=table><tr><th>Müşteri</th><th>Cihaz</th><th>Satış</th><th>Ödenen</th><th>Kalan</th><th></th></tr>${db.receivables.filter(r=>r.remaining>0).map(r=>`<tr><td>${r.customer}<br>${r.phoneNo}</td><td>${r.phone}</td><td>${money(r.price)}</td><td>${money(r.paid)}</td><td class=orange>${money(r.remaining)}</td><td><button class="btn secondary" onclick="collect('${r.id}')">Tahsilat</button></td></tr>`).join('')||'<tr><td colspan=6 class=empty>Bekleyen alacak yok.</td></tr>'}</table></div>`)}
function collect(id){const r=db.receivables.find(x=>x.id===id);const val=prompt(`Kalan ${money(r.remaining)} — tahsilat tutarı`,r.remaining);const n=Number(val);if(!(n>0)||n>r.remaining)return;const s=db.sales.find(x=>x.id===r.saleId);r.remaining-=n;r.paid+=n;r.pendingProfit=Math.max(0,(s?.profit||0)*(r.remaining/(r.price||1)));r.history=r.history||[];r.history.push({date:today(),amount:n});if(s){s.paid+=n;s.realizedProfit=s.profit*(s.paid/s.price)}db.cash+=n;db.capitalMoves.unshift({id:uid(),date:today(),type:'Müşteri borç ödemesi',amount:n,ref:id});audit('Müşteri tahsilatı',money(n));save();closeModal();render();toast('Tahsilat işlendi')}
function capitalPage(){const rows=db.capitalMoves.map(x=>`<tr><td>${x.date}</td><td>${x.type}</td><td class="${x.amount<0?'red':'green'}">${money(x.amount)}</td></tr>`).join('');basePage('Sermaye Ekstresi',`<div class=summary><div>Başlangıç sermayesi <b>${money(db.startCapital)}</b></div><div>Kullanılabilir nakit <b>${money(db.cash)}</b></div><div>Stoka bağlı para <b>${money(totals().stockCost)}</b></div></div><div class=tableWrap style="margin-top:10px"><table class=table><tr><th>Tarih</th><th>Hareket</th><th>Tutar</th></tr>${rows||'<tr><td colspan=3 class=empty>Hareket yok.</td></tr>'}</table></div>`)}
function reportsPage(){const t=totals();const sold=db.sales.filter(x=>x.status!=='İptal');const avg=sold.length?sold.reduce((a,x)=>a+x.profit,0)/sold.length:0;const brands={};sold.forEach(s=>{const p=db.phones.find(x=>x.id===s.phoneId);brands[p?.brand||'Diğer']=(brands[p?.brand||'Diğer']||0)+1});const top=Object.entries(brands).sort((a,b)=>b[1]-a[1])[0]?.[0]||'-';basePage('Kâr ve Raporlar',`<div class=kpi3>${card('Gerçekleşen net kâr',money(t.realized),'green')}${card('Bekleyen kâr',money(t.pending),'orange')}${card('Satış cirosu',money(t.revenue))}${card('Satılan telefon',t.sold)}${card('Ortalama telefon başı kâr',money(avg),'green')}${card('En çok satılan marka',top)}</div><div class=summary style="margin-top:10px"><div>Bekleyen alacak <b>${money(t.debt)}</b></div><div>Stok değeri <b>${money(t.stockCost)}</b></div></div>`)}
function closingPage(){const m=today().slice(0,7);const buys=db.purchases.filter(x=>x.date.startsWith(m));const sales=db.sales.filter(x=>x.date.startsWith(m)&&x.status!=='İptal');basePage('Aylık Kasa Kapanışı',`<div class=summary>${[['Ay',m],['Ay başı nakit',money(db.startCapital)],['Alınan telefon',buys.length],['Toplam alış maliyeti',money(buys.reduce((a,x)=>a+x.total,0))],['Satılan telefon',sales.length],['Satış cirosu',money(sales.reduce((a,x)=>a+x.price,0))],['Tahsil edilen',money(sales.reduce((a,x)=>a+x.paid,0))],['Bekleyen alacak',money(totals().debt)],['Gerçekleşen net kâr',money(totals().realized)],['Stok değeri',money(totals().stockCost)],['Ay sonu kullanılabilir nakit',money(db.cash)]].map(x=>`<div>${x[0]} <b>${x[1]}</b></div>`).join('')}</div><p class=tiny>Bulut sürümünde kapanışlar ayrıca arşivlenebilir.</p>`)}
function ibanPage(){basePage('IBAN ve Belgeler',`<button class="btn primary" onclick=addIban()>＋ IBAN Ekle</button><div class=list style="margin-top:10px">${db.ibans.map(i=>`<div class=item><b>${i.bank}</b><div class=tiny>${i.owner}<br>${i.iban}</div></div>`).join('')||'<div class=empty>IBAN eklenmedi.</div>'}</div>`)}
function addIban(){const bank=prompt('Banka');if(!bank)return;const owner=prompt('Hesap sahibi')||'';const iban=prompt('IBAN')||'';db.ibans.push({id:uid(),bank,owner,iban});audit('IBAN eklendi',bank);save();closeModal();toast('IBAN kaydedildi')}
function usersPage(){basePage('Kullanıcılar',`<p class=tiny>Yönetici dışında en fazla 7 çalışan.</p><button class="btn primary" onclick=addUser()>＋ Çalışan Ekle</button><div class=list style="margin-top:10px">${db.users.map(u=>`<div class=item><div class=row><b>${u.name}</b><span class=pill>${u.role}</span></div><div class=tiny>${u.role==='Yönetici'?'Tam yetki':'Yetkiler ayrı yönetilecek'}</div></div>`).join('')}</div>`)}
function addUser(){const employees=db.users.filter(u=>u.role==='Çalışan');if(employees.length>=7)return toast('En fazla 7 çalışan hesabı');const name=prompt('Çalışan adı');const pin=prompt('Çalışan PIN');if(!name||!pin)return;db.users.push({id:uid(),name,role:'Çalışan',pin,permissions:{delete:false,capital:false,settings:false}});audit('Çalışan hesabı oluşturuldu',name);save();closeModal();toast('Çalışan oluşturuldu')}
function auditPage(){basePage('İşlem Geçmişi',`<div class=tableWrap><table class=table><tr><th>Tarih</th><th>Kullanıcı</th><th>İşlem</th><th>Detay</th></tr>${db.audit.map(a=>`<tr><td>${new Date(a.at).toLocaleString('tr-TR')}</td><td>${a.user}</td><td>${a.action}</td><td>${a.meta}</td></tr>`).join('')||'<tr><td colspan=4 class=empty>İşlem yok.</td></tr>'}</table></div>`)}
function settingsPage(){basePage('Ayarlar',`<div class=form><label>Otomatik kilit süresi (dakika)</label><input id=lockMin type=number min=1 value=${db.settings.lockMinutes}><button class="btn primary" onclick=saveSettings()>Ayarları Kaydet</button><button class="btn secondary" onclick=changePin()>Yönetici PIN Değiştir</button><button class="btn secondary" onclick=setCapital()>Başlangıç Sermayesini Belirle</button><div class=summary><div>Başlangıç sermayesi <b>${money(db.startCapital)}</b></div><div>Kullanılabilir nakit <b>${money(db.cash)}</b></div></div></div>`)}
function saveSettings(){db.settings.lockMinutes=Math.max(1,Number(lockMin.value)||15);save();audit('Ayarlar değiştirildi');closeModal();toast('Ayarlar kaydedildi')}
function changePin(){const u=db.users.find(x=>x.role==='Yönetici');const n=prompt('Yeni PIN');if(!n)return;u.pin=n;save();audit('Yönetici PIN değiştirildi');closeModal();toast('PIN değiştirildi')}
function setCapital(){if(db.phones.length||db.sales.length||db.capitalMoves.length)return toast('İşletmede hareket varken başlangıç sermayesi değiştirilemez');const n=Number(prompt('Başlangıç sermayesi',db.startCapital||124000));if(!(n>=0))return;db.startCapital=n;db.cash=n;db.capitalMoves.unshift({id:uid(),date:today(),type:'Başlangıç sermayesi',amount:n});audit('Başlangıç sermayesi belirlendi',money(n));save();closeModal();render();toast('Başlangıç sermayesi kaydedildi')}
let timer=setInterval(()=>{if(!locked&&Date.now()-lastActivity>db.settings.lockMinutes*60000)lockNow()},10000);['touchstart','click','keydown','input'].forEach(e=>document.addEventListener(e,()=>{if(!locked)lastActivity=Date.now()},{passive:true}));
// 124.000 TL test: 124000 - 33250 = 90750; +36000 = 126750; profit 36000 - 33250 = 2750.
function selfTest(){const afterBuy=124000-(33000+250),afterSale=afterBuy+36000,profit=36000-33000-250;return afterBuy===90750&&afterSale===126750&&profit===2750}console.assert(selfTest(),'EKTECH sermaye test hatası');
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script>
</body></html>
