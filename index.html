<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07172b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="EKTECH APPLE STORE">
<link rel="manifest" href="manifest.json">

<title>EKTECH APPLE STORE</title>

<style>
:root{
  --navy:#07172b;
  --navy2:#0e2948;
  --gold:#c7a45a;
  --bg:#f4f6f8;
  --card:#fff;
  --text:#172033;
  --muted:#718096;
  --line:#e5e9ef;
  --green:#159957;
  --red:#d64545;
  --blue:#2166d1;
  --shadow:0 10px 28px rgba(7,23,43,.08)
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  overflow-x:hidden
}

body{
  overscroll-behavior-x:none
}

button,
input,
select,
textarea{
  font:inherit
}

button{
  cursor:pointer
}

/* =========================================================
   ÜST MENÜ
   iPHONE / SAFARI / ANA EKRAN FIX
   ========================================================= */

.top{
  position:fixed!important;
top:10px!important;
  left:0!important;
  right:0!important;

  width:100%!important;
  height:74px!important;

  padding:
    env(safe-area-inset-top)
    12px
    0!important;

  background:#fff;
  color:var(--navy);

  z-index:999999!important;

  display:flex;
  align-items:center;
  gap:12px;

  box-shadow:0 1px 0 rgba(7,23,43,.08);

  transform:none!important;
  -webkit-transform:none!important;

  will-change:auto!important;
  isolation:isolate
}

.top-inner{
  height:74px;
  width:100%;
  display:flex;
  align-items:center;
  gap:12px
padding-top:12px;
}

.hamb,
.lock{
  border:0;
  background:#eef2f6;
  color:var(--navy);

  width:46px;
  height:46px;

  border-radius:15px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:21px;

  flex:0 0 auto;

  position:relative!important;
  z-index:1000000!important;

  touch-action:manipulation
}

.hamb:active,
.lock:active,
.btn:active,
.quick button:active{
  transform:scale(.97)
}

.brand{
  font-size:18px;
  font-weight:900;
  letter-spacing:.3px;

  flex:1;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.top-sub{
  display:block;
  font-size:9px;
  color:var(--muted);
  font-weight:600;
  margin-top:2px
}

/* =========================================================
   ANA İÇERİK
   ========================================================= */

.wrap{
  position:relative;
  z-index:1;

  width:100%;

  padding:
    92px
    14px
    32px!important;

  max-width:980px;

  margin:auto;

  transform:none!important;
  -webkit-transform:none!important
}

/* =========================================================
   SOL MENÜ
   ========================================================= */

#drawer{
  position:fixed!important;

  top:0!important;
  left:0!important;
  bottom:0!important;

  width:min(86vw,360px)!important;

  height:100dvh!important;
  min-height:100vh!important;

  z-index:999998!important;

  background:#fff;

  box-shadow:18px 0 40px rgba(0,0,0,.22);

  overflow-y:auto!important;
  overflow-x:hidden!important;

  -webkit-overflow-scrolling:touch!important;

  transform:translate3d(-105%,0,0)!important;
  -webkit-transform:translate3d(-105%,0,0)!important;

  transition:
    transform .25s cubic-bezier(.2,.8,.2,1),
    -webkit-transform .25s cubic-bezier(.2,.8,.2,1)!important;

  will-change:transform;

  overscroll-behavior:contain;

  touch-action:pan-y!important;

  visibility:hidden;
  pointer-events:none
}

#drawer.open{
  transform:translate3d(0,0,0)!important;
  -webkit-transform:translate3d(0,0,0)!important;

  visibility:visible!important;
  pointer-events:auto!important
}

#drawer .drawer-head{
  padding:
    calc(env(safe-area-inset-top) + 22px)
    20px
    18px;

  background:
    linear-gradient(
      145deg,
      var(--navy),
      var(--navy2)
    );

  color:#fff
}

.drawer-brand{
  font-size:20px;
  font-weight:900
}

.drawer-small{
  font-size:11px;
  opacity:.7;
  margin-top:5px
}

.drawer-section{
  padding:12px
}

.drawer-label{
  font-size:10px;
  color:#98a3b3;
  font-weight:800;
  text-transform:uppercase;
  padding:8px 10px
}

.menu-btn{
  width:100%;

  border:0;
  background:#fff;
  color:var(--text);

  display:flex;
  align-items:center;
  gap:12px;

  padding:13px 12px;

  border-radius:13px;

  text-align:left;

  font-weight:700
}

.menu-btn:hover,
.menu-btn.active{
  background:#eef3f8
}

.menu-icon{
  width:28px;
  text-align:center;
  font-size:18px
}

.menu-danger{
  color:var(--red)
}

#drawerShade{
  position:fixed;
  inset:0;

  background:rgba(0,0,0,.38);

  z-index:999997;

  display:none;

  opacity:0;

  transition:opacity .2s
}

#drawerShade.open{
  display:block;
  opacity:1
}

body.menu-open{
  overflow:hidden!important;
  position:fixed!important;
  width:100%!important;
  left:0!important;
  right:0!important
}

/* =========================================================
   GENEL TASARIM
   ========================================================= */

.card{
  background:var(--card);

  border:1px solid var(--line);

  border-radius:22px;

  box-shadow:var(--shadow)
}

.hero{
  background:
    linear-gradient(
      145deg,
      var(--navy),
      var(--navy2)
    );

  color:#fff;

  padding:20px;

  border-radius:24px;

  box-shadow:
    0 16px 35px rgba(7,23,43,.18);

  margin-bottom:16px
}

.eyebrow{
  font-size:11px;
  opacity:.65;
  font-weight:800;
  letter-spacing:.7px;
  text-transform:uppercase
}

.hero h1{
  margin:5px 0 3px;
  font-size:28px
}

.hero p{
  margin:0;
  color:#c7d3e2;
  font-size:12px
}

.balance{
  margin-top:18px;
  padding-top:15px;
  border-top:1px solid rgba(255,255,255,.14)
}

.balance-label{
  font-size:11px;
  color:#b9c8d9
}

.balance-value{
  font-size:30px;
  font-weight:900;
  margin-top:4px
}

.grid{
  display:grid;
  grid-template-columns:
    repeat(2,minmax(0,1fr));
  gap:12px
}

.grid3{
  display:grid;
  grid-template-columns:
    repeat(3,minmax(0,1fr));
  gap:12px
}

.grid4{
  display:grid;
  grid-template-columns:
    repeat(4,minmax(0,1fr));
  gap:10px
}

.stat{
  padding:16px
}

.stat .label{
  font-size:11px;
  color:var(--muted)
}

.stat .value{
  font-size:20px;
  font-weight:900;
  margin-top:5px
}

.green{
  color:var(--green)!important
}

.red{
  color:var(--red)!important
}

.blue{
  color:var(--blue)!important
}

.section-title{
  font-size:17px;
  font-weight:900;
  margin:20px 2px 10px
}

.quick button{
  border:1px solid var(--line);

  background:#fff;

  border-radius:17px;

  padding:13px 7px;

  min-height:78px;

  font-weight:800;

  color:var(--text);

  box-shadow:
    0 5px 16px rgba(7,23,43,.05)
}

.quick-icon{
  font-size:22px;
  display:block;
  margin-bottom:7px
}

.quick-label{
  font-size:10px
}

.panel{
  padding:16px;
  margin-bottom:14px
}

.panel-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:12px
}

.panel-title{
  font-weight:900
}

.muted{
  color:var(--muted);
  font-size:12px
}

/* =========================================================
   BUTONLAR
   ========================================================= */

.btn{
  border:0;
  border-radius:13px;

  padding:11px 15px;

  font-weight:800;

  background:#e9eef4;
  color:var(--navy);

  touch-action:manipulation
}

.btn.primary{
  background:var(--navy);
  color:#fff
}

.btn.gold{
  background:var(--gold);
  color:#fff
}

.btn.green{
  background:var(--green);
  color:#fff
}

.btn.red{
  background:var(--red);
  color:#fff
}

.btn.small{
  padding:8px 10px;
  font-size:11px
}

/* =========================================================
   FORM
   ========================================================= */

.form{
  padding:17px
}

.form h2{
  margin:0 0 15px;
  font-size:20px
}

.field{
  margin-bottom:12px
}

.field label{
  display:block;

  font-size:11px;
  font-weight:800;

  color:#667085;

  margin:0 0 6px
}

.field input,
.field select,
.field textarea{
  width:100%;

  border:1px solid #dfe4ea;

  background:#fff;

  border-radius:12px;

  padding:12px;

  color:var(--text);

  outline:none
}

.field input:focus,
.field select:focus,
.field textarea:focus{
  border-color:#7d9dc3;

  box-shadow:
    0 0 0 3px
    rgba(33,102,209,.08)
}

.search{
  width:100%;

  border:1px solid var(--line);

  border-radius:12px;

  padding:11px 12px;

  margin-bottom:10px
}

/* =========================================================
   TABLO
   ========================================================= */

.table-wrap{
  overflow:auto;

  border:1px solid var(--line);

  border-radius:15px
}

.table{
  width:100%;

  border-collapse:collapse;

  min-width:720px
}

.table th,
.table td{
  padding:11px 10px;

  border-bottom:1px solid var(--line);

  text-align:left;

  font-size:11px
}

.table th{
  background:#f7f8fa;

  font-weight:900;

  color:#536174
}

.table tr:last-child td{
  border-bottom:0
}

.tag{
  display:inline-block;

  padding:5px 8px;

  border-radius:999px;

  background:#edf2f7;

  font-size:10px;

  font-weight:800
}

/* =========================================================
   MODAL
   ========================================================= */

.modal-bg{
  position:fixed;
  inset:0;

  background:rgba(0,0,0,.5);

  z-index:1000001;

  display:flex;

  align-items:flex-end;
  justify-content:center;

  padding:0
}

.modal{
  width:min(760px,100%);

  max-height:92dvh;

  overflow:auto;

  background:#fff;

  border-radius:
    24px 24px 0 0;

  padding:18px;

  box-shadow:
    0 -15px 40px rgba(0,0,0,.2)
}

.modal-head{
  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:10px;

  margin-bottom:10px
}

.close{
  border:0;

  background:#eef2f6;

  width:38px;
  height:38px;

  border-radius:12px;

  font-size:18px
}

.summary{
  padding:13px;

  border-radius:14px;

  background:#f4f7fa;

  margin:8px 0 12px
}

/* =========================================================
   TOAST
   ========================================================= */

.toast{
  position:fixed;

  left:50%;
  bottom:22px;

  transform:translateX(-50%);

  z-index:2000000;

  background:#07172b;

  color:#fff;

  padding:11px 16px;

  border-radius:999px;

  font-size:12px;

  box-shadow:
    0 10px 30px rgba(0,0,0,.25)
}

/* =========================================================
   LOGIN
   ========================================================= */

.login-bg{
  position:fixed;
  inset:0;

  background:
    linear-gradient(
      145deg,
      #061426,
      #0e2948
    );

  z-index:3000000;

  display:flex;

  align-items:center;
  justify-content:center;

  padding:20px
}

.login-card{
  width:min(420px,100%);

  background:#fff;

  border-radius:28px;

  padding:26px;

  box-shadow:
    0 20px 60px rgba(0,0,0,.35)
}

.login-logo{
  width:62px;
  height:62px;

  border-radius:19px;

  background:var(--navy);

  color:#fff;

  display:flex;

  align-items:center;
  justify-content:center;

  font-weight:900;

  margin-bottom:15px
}

.login-card h1{
  margin:0;

  font-size:24px
}

.login-card p{
  color:var(--muted);
  font-size:12px
}

.pin{
  font-size:25px;

  letter-spacing:8px;

  text-align:center
}

.empty{
  padding:30px;

  text-align:center;

  color:var(--muted);

  font-size:12px
}

/* =========================================================
   iPHONE STANDALONE
   ========================================================= */

@media(display-mode:standalone){

  .top{
    position:fixed!important;

    top:0!important;
    left:0!important;
    right:0!important;

    transform:none!important;
    -webkit-transform:none!important
  }

  .wrap{
    padding-top:92px!important
  }

  #drawer{
    height:100dvh!important;
    min-height:100vh!important;

    transform:
      translate3d(-105%,0,0)!important;

    -webkit-transform:
      translate3d(-105%,0,0)!important
  }

  #drawer.open{
    transform:
      translate3d(0,0,0)!important;

    -webkit-transform:
      translate3d(0,0,0)!important
  }
}

@media(max-width:560px){

  .grid3{
    grid-template-columns:1fr 1fr
  }

  .grid4{
    grid-template-columns:
      repeat(2,1fr)
  }

  .brand{
    font-size:16px
  }

  .hero h1{
    font-size:25px
  }

  .wrap{
    padding-left:11px!important;
    padding-right:11px!important
  }
}
</style>
</head>

<body>

<div id="app"></div>
<div id="drawer"></div>
<div id="drawerShade"></div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>

/* =========================================================
   TEMEL SİSTEM
   ========================================================= */

const APP='EKTECH APPLE STORE';
const KEY='ektech_applestore_v3';

const today=()=>
  new Date().toISOString().slice(0,10);

const money=n=>
  new Intl.NumberFormat(
    'tr-TR',
    {
      style:'currency',
      currency:'TRY',
      maximumFractionDigits:0
    }
  ).format(Number(n)||0);

const uid=()=>
  Date.now().toString(36)+
  Math.random().toString(36).slice(2,8);

const esc=v=>
  String(v??'').replace(
    /[&<>'"]/g,
    m=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      "'":'&#39;',
      '"':'&quot;'
    }[m])
  );

/* =========================================================
   VERİTABANI
   ========================================================= */

const seed=()=>({
  startCapital:0,
  cash:0,

  phones:[],
  purchases:[],
  sales:[],
  receivables:[],
  capitalMoves:[],
  ibans:[],
  audit:[],

  users:[
    {
      id:'owner',
      name:'Yönetici',
      pin:'1234',
      role:'manager',
      active:true
    }
  ],

  settings:{
    lockMinutes:10
  }
});

function load(){

  try{

    const x=
      JSON.parse(
        localStorage.getItem(KEY)
      );

    return x&&x.users
      ?x
      :seed();

  }catch(e){

    return seed();

  }
}

let db=load();

let currentUser=null;
let locked=true;

let selectedMonth=
  today().slice(0,7);

let lockTimer=null;

/* =========================================================
   KAYDET
   ========================================================= */

function save(){

  localStorage.setItem(
    KEY,
    JSON.stringify(db)
  );

}

/* =========================================================
   BİLDİRİM
   ========================================================= */

function toast(s){

  const r=
    document.getElementById(
      'toastRoot'
    );

  r.innerHTML=
    '<div class="toast">'+
    esc(s)+
    '</div>';

  setTimeout(
    ()=>{
      r.innerHTML='';
    },
    2200
  );

}

/* =========================================================
   İŞLEM GEÇMİŞİ
   ========================================================= */

function audit(action,meta=''){

  db.audit.unshift({

    id:uid(),

    date:new Date().toISOString(),

    user:
      currentUser?.name||
      'Sistem',

    action,

    meta

  });

  db.audit=
    db.audit.slice(0,500);

  save();

}

/* =========================================================
   TOPLAMLAR
   ========================================================= */

function totals(){

  const stock=
    db.phones.filter(
      p=>!p.sold
    );

  const stockCost=
    stock.reduce(
      (a,p)=>
        a+Number(p.cost||0),
      0
    );

  const sales=
    db.sales.reduce(
      (a,s)=>
        a+Number(s.total||0),
      0
    );

  const saleCost=
    db.sales.reduce(
      (a,s)=>
        a+Number(s.cost||0),
      0
    );

  const profit=
    db.sales.reduce(
      (a,s)=>
        a+Number(s.profit||0),
      0
    );

  const rec=
    db.receivables
      .filter(r=>!r.paid)
      .reduce(
        (a,r)=>
          a+Number(r.remaining||0),
        0
      );

  return{

    stock,
    stockCost,
    sales,
    saleCost,
    profit,
    rec,

    cash:
      Number(db.cash||0),

    capital:
      Number(db.startCapital||0)

  };

}

/* =========================================================
   KİLİT
   ========================================================= */

function lockNow(){

  locked=true;

  currentUser=null;

  closeDrawer();

  render();

}

function resetLockTimer(){

  clearTimeout(lockTimer);

  if(!currentUser)
    return;

  const min=
    Math.max(
      1,
      Number(
        db.settings.lockMinutes
      )||10
    );

  lockTimer=
    setTimeout(
      lockNow,
      min*60000
    );

}

[
  'click',
  'touchstart',
  'keydown',
  'scroll'
].forEach(
  ev=>document.addEventListener(
    ev,
    ()=>{
      if(currentUser)
        resetLockTimer();
    },
    {passive:true}
  )
);

/* =========================================================
   GİRİŞ
   ========================================================= */

function login(){

  const app=
    document.getElementById(
      'app'
    );

  app.innerHTML=`

<div class="login-bg">

  <div class="login-card">

    <div class="login-logo">
      EK
    </div>

    <div class="eyebrow">
      GÜVENLİ GİRİŞ
    </div>

    <h1>
      EKTECH APPLE STORE
    </h1>

    <p>
      Devam etmek için PIN kodunuzu girin.
    </p>

    <div class="field">

      <label>
        Kullanıcı
      </label>

      <select id="loginUser">

        ${
          db.users
          .filter(
            u=>u.active!==false
          )
          .map(
            u=>
            '<option value="'+
            esc(u.id)+
            '">'+
            esc(u.name)+
            '</option>'
          )
          .join('')
        }

      </select>

    </div>

    <div class="field">

      <label>
        PIN
      </label>

      <input
        id="loginPin"
        class="pin"
        type="password"
        inputmode="numeric"
        maxlength="12"
        autocomplete="off"
        onkeydown="
          if(event.key==='Enter')
            loginGo()
        "
      >

    </div>

    <button
      class="btn primary"
      style="width:100%;padding:14px"
      onclick="loginGo()"
    >
      Giriş Yap
    </button>

    <div
      class="muted"
      style="text-align:center;margin-top:12px"
    >
      İlk kurulum PIN: 1234
    </div>

  </div>

</div>

`;

  setTimeout(
    ()=>{
      document
        .getElementById(
          'loginPin'
        )
        ?.focus();
    },
    50
  );

}

function loginGo(){

  const id=
    document.getElementById(
      'loginUser'
    ).value;

  const pin=
    document.getElementById(
      'loginPin'
    ).value;

  const u=
    db.users.find(
      x=>x.id===id
    );

  if(
    u &&
    u.pin===pin
  ){

    currentUser=u;

    locked=false;

    audit('Giriş yaptı');

    resetLockTimer();

    render();

  }else{

    toast('PIN hatalı');

  }

}

/* =========================================================
   iPHONE MENÜ
   ========================================================= */

function openDrawer(){

  const d=
    document.getElementById(
      'drawer'
    );

  const s=
    document.getElementById(
      'drawerShade'
    );

  if(!d)
    return;

  d.classList.add('open');

  s.classList.add('open');

  document.body
    .classList
    .add('menu-open');

  document.documentElement
    .classList
    .add('menu-open');

  d.style.setProperty(
    'transform',
    'translate3d(0,0,0)',
    'important'
  );

  d.style.setProperty(
    '-webkit-transform',
    'translate3d(0,0,0)',
    'important'
  );

}

function closeDrawer(){

  const d=
    document.getElementById(
      'drawer'
    );

  const s=
    document.getElementById(
      'drawerShade'
    );

  if(!d)
    return;

  d.classList.remove('open');

  s.classList.remove('open');

  document.body
    .classList
    .remove('menu-open');

  document.documentElement
    .classList

   ALIŞ KAYDET
   ========================================================= */

function saveBuy(){

  const serial=
    document
    .getElementById(
      'bSerial'
    )
    .value
    .trim();

  const imei=
    document
    .getElementById(
      'bImei'
    )
    .value
    .trim();

  const imei2=
    document
    .getElementById(
      'bImei2'
    )
    .value
    .trim();

  const price=
    Number(
      document
      .getElementById(
        'bPrice'
      )
      .value
    )||0;

  const ship=
    Number(
      document
      .getElementById(
        'bShip'
      )
      .value
    )||0;

  if(
    !imei||
    !/^\d{15}$/.test(imei)
  )
    return toast(
      'IMEI 15 haneli olmalı'
    );

  if(
    imei2&&
    !/^\d{15}$/.test(imei2)
  )
    return toast(
      'IMEI 2 15 haneli olmalı'
    );

  if(
    !price||
    price<0
  )
    return toast(
      'Alış fiyatını girin'
    );

  if(
    serial&&
    db.phones.some(
      p=>
        p.serial&&
        p.serial.toLowerCase()===
        serial.toLowerCase()
    )
  )
    return toast(
      'Bu seri numarası zaten kayıtlı'
    );

  if(
    db.phones.some(
      p=>
        p.imei===imei||
        p.imei2===imei||
        (
          imei2&&
          (
            p.imei===imei2||
            p.imei2===imei2
          )
        )
    )
  )
    return toast(
      'Bu IMEI zaten kayıtlı'
    );

  const total=
    price+ship;

  if(
    total>db.cash
  )
    return toast(
      'Kullanılabilir kasa yetersiz'
    );

  const p={

    id:uid(),

    brand:
      document
      .getElementById(
        'bBrand'
      ).value,

    model:
      document
      .getElementById(
        'bModel'
      ).value,

    storage:
      document
      .getElementById(
        'bStorage'
      ).value,

    color:
      document
      .getElementById(
        'bColor'
      ).value,

    serial,

    imei,

    imei2,

    stockDate:
      document
      .getElementById(
        'bDate'
      ).value,

    cost:total,

    price,

    ship,

    supplier:
      document
      .getElementById(
        'bSupplier'
      ).value,

    condition:
      document
      .getElementById(
        'bCondition'
      ).value,

    origin:
      document
      .getElementById(
        'bOrigin'
      ).value,

    warranty:
      document
      .getElementById(
        'bWarranty'
      ).value,

    cosmetic:
      document
      .getElementById(
        'bCosmetic'
      ).value,

    useInfo:
      document
      .getElementById(
        'bUse'
      ).value,

    sold:false

  };

  db.phones.push(p);

  db.purchases.unshift({

    id:uid(),

    phoneId:p.id,

    date:p.stockDate,

    total,

    price,

    ship

  });

  db.cash-=total;

  db.capitalMoves.unshift({

    id:uid(),

    date:p.stockDate,

    type:'Telefon alış',

    amount:-total,

    note:
      p.brand+
      ' '+
      p.model

  });

  audit(
    'Telefon alış',
    p.brand+
    ' '+
    p.model+
    ' · '+
    money(total)
  );

  save();

  closeModal();

  render();

  toast(
    'Telefon alış kaydedildi'
  );

}

function salePreview(){

  const p=
    db.phones.find(
      x=>
        x.id===
        document
        .getElementById(
          'sPhone'
        )?.value
    );

  if(!p)
    return;

  const price=
    Number(
      document
      .getElementById(
        'sPrice'
      )?.value
    )||0;

  const col=
    Number(
      document
      .getElementById(
        'sCollected'
      )?.value
    )||0;

  const profit=
    price-
    Number(p.cost||0);

  const e=
    document.getElementById(
      'saleSum'
    );

  if(e){

    e.innerHTML=

      'Maliyet: <b>'+
      money(p.cost)+
      '</b> · Kâr: <b class="'+
      (
        profit>=0
        ?'green'
        :'red'
      )+
      '">'+
      money(profit)+
      '</b> · Tahsilat: <b>'+
      money(col)+
      '</b>';

  }

function saveSale(){

  const p=
    db.phones.find(
      x=>
        x.id===
        document
        .getElementById(
          'sPhone'
        ).value
    );

  if(!p||p.sold)
    return toast(
      'Cihaz bulunamadı'
    );

  const price=
    Number(
      document
      .getElementById(
        'sPrice'
      ).value
    )||0;

  const col=
    Number(
      document
      .getElementById(
        'sCollected'
      ).value
    )||0;

  if(price<=0)
    return toast(
      'Satış fiyatını girin'
    );

  if(
    col<0||
    col>price
  )
    return toast(
      'Tahsilat tutarını kontrol edin'
    );

  const remaining=
    price-col;

  const sale={

    id:uid(),

    phoneId:p.id,

    date:
      document
      .getElementById(
        'sDate'
      ).value,

    customer:
      document
      .getElementById(
        'sCustomer'
      )
      .value
      .trim()||
      'Müşteri',

    customerPhone:
      document
      .getElementById(
        'sCustomerPhone'
      )
      .value
      .trim(),

    total:price,

    collected:col,

    remaining,

    cost:
      Number(p.cost||0),

    profit:
      price-
      Number(p.cost||0),

    payment:
      document
      .getElementById(
        'sPayment'
      ).value,

    note:
      document
      .getElementById(
        'sNote'
      ).value

  };

  p.sold=true;
  p.saleId=sale.id;

  db.sales.unshift(
    sale
  );

  db.cash+=col;

  if(remaining>0){

    db.receivables.unshift({

      id:uid(),

      saleId:sale.id,

      customer:sale.customer,

      phone:sale.customerPhone,

      total:price,

      collected:col,

      remaining,

      paid:false,

      date:sale.date

    });

  }

  audit(
    'Telefon satışı',
    p.brand+
    ' '+
    p.model+
    ' · '+
    money(price)
  );

  save();

  closeModal();

  render();

  toast(
    'Satış kaydedildi'
  );

}

function saveCollect(id){

  const r=
    db.receivables.find(
      x=>x.id===id
    );

  const a=
    Number(
      document
      .getElementById(
        'collectAmount'
      ).value
    )||0;

  if(
    !r||
    a<=0||
    a>r.remaining
  )
    return toast(
      'Tutarı kontrol edin'
    );

  r.collected+=a;

  r.remaining-=a;

  r.paid=
    r.remaining<=0;

  db.cash+=a;

  audit(
    'Alacak tahsilatı',
    r.customer+
    ' · '+
    money(a)
  );

  save();

  closeModal();

  receivablesPage();

  toast(
    'Tahsilat kaydedildi'
  );

}

function saveCapital(){

  const type=
    document
    .getElementById(
      'capType'
    ).value;

  const a=
    Number(
      document
      .getElementById(
        'capAmount'
      ).value
    )||0;

  const n=
    document
    .getElementById(
      'capNote'
    ).value;

  if(a<=0)
    return toast(
      'Tutar girin'
    );

  if(
    type==='Kasa Çıkışı'&&
    a>db.cash
  )
    return toast(
      'Kasa yetersiz'
    );

  const sign=
    type==='Sermaye Girişi'
    ?1
    :-1;

  db.cash+=
    sign*a;

  if(
    type==='Sermaye Girişi'
  )
    db.startCapital+=a;

  db.capitalMoves.unshift({

    id:uid(),

    date:today(),

    type,

    amount:sign*a,

    note:n

  });

  audit(
    type,
    money(a)
  );

  save();

  closeModal();

  render();

  toast(
    'Kasa hareketi kaydedildi'
  );

}

<div class="table-wrap">

<table class="table">

<thead>

<tr>

<th>
Tarih
</th>

<th>
Kullanıcı
</th>

<th>
İşlem
</th>

<th>
Detay
</th>

</tr>

</thead>

<tbody>
${rows}
</tbody>

</table>

</div>

`

    :

`

<div class="empty">
İşlem geçmişi yok.
</div>

`
  );

}

/* =========================================================
   AYARLAR
   ========================================================= */

function settingsPage(){

  basePage(
    'Ayarlar',

`

<div class="form">

<div class="field">

<label>
Otomatik kilit süresi (dakika)
</label>

<input
  id="lockMin"
  type="number"
  min="1"
  value="${Number(
    db.settings.lockMinutes||10
  )}"
>

</div>

<button
  class="btn primary"
  onclick="saveSettings()"
>
Ayarları Kaydet
</button>

<div class="section-title">
Güvenlik
</div>

<button
  class="btn"
  onclick="changePin()"
>
Mevcut hesabın PIN kodunu değiştir
</button>

<div class="section-title">
Veri
</div>

<button
  class="btn red"
  onclick="exportData()"
>
Yedek JSON indir
</button>

<button
  class="btn"
  style="margin-left:6px"
  onclick="importDataPrompt()"
>
JSON içe aktar
</button>

</div>

`
  );

}

function saveSettings(){

  db.settings.lockMinutes=
    Math.max(
      1,
      Number(
        document
        .getElementById(
          'lockMin'
        ).value
      )||10
    );

  save();

  resetLockTimer();

  toast(
    'Ayarlar kaydedildi'
  );

}

function changePin(){

  const u=
    db.users.find(
      x=>x.id===
      currentUser.id
    );

  const p=
    prompt(
      'Yeni PIN'
    );

  if(
    !p||
    p.length<4
  )
    return toast(
      'PIN en az 4 hane'
    );

  u.pin=p;

  save();

  audit(
    'PIN değiştirdi'
  );

  toast(
    'PIN değiştirildi'
  );

}

/* =========================================================
   YEDEK
   ========================================================= */

function exportData(){

  const a=
    document.createElement(
      'a'
    );

  a.href=
    'data:application/json;charset=utf-8,'+
    encodeURIComponent(
      JSON.stringify(
        db,
        null,
        2
      )
    );

  a.download=
    'ektech-applestore-yedek-'+
    today()+
    '.json';

  a.click();

}

function importDataPrompt(){

  const txt=
    prompt(
      'Yedek JSON içeriğini buraya yapıştırın'
    );

  if(!txt)
    return;

  try{

    const x=
      JSON.parse(txt);

    if(
      !x.users||
      !x.phones
    )
      return toast(
        'Geçersiz yedek'
      );

    db=x;

    save();

    render();

    toast(
      'Yedek içe aktarıldı'
    );

  }catch(e){

    toast(
      'JSON okunamadı'
    );

  }

}

/* =========================================================
   RENDER
   ========================================================= */

function render(){

  if(
    locked||
    !currentUser
  ){

    login();

    return;

  }

  dashboard();

}

/* =========================================================
   SERVICE WORKER
   ========================================================= */

if(
  'serviceWorker' in navigator
){

  try{

    navigator
      .serviceWorker
      .register(
        './sw.js'
      )
      .catch(
        ()=>{}
      );

  }catch(e){}

}

/* =========================================================
   BAŞLAT
   ========================================================= */

render();

</script>

</body>
</html>
